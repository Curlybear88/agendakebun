<style>
:root{--navy:#1f3864;--blue:#4472C4;--org:#ED7D31;--bg:#f4f6fa;--line:#d9dee8;--mut:#667}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,system-ui,sans-serif;background:var(--bg);color:#111;padding-bottom:72px;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header b{font-size:18px}header small{display:block;opacity:.8;font-size:12px}
main{padding:12px;max-width:640px;margin:auto}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:14px;color:#555}
nav button.on{color:var(--blue);font-weight:700;border-top:3px solid var(--blue);padding-top:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.sub{font-size:12px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eef0f5;font-size:14px}
.kv:last-child{border:0}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid #eef0f5}
.row:last-child{border:0}
.cb{flex:none;width:28px;height:28px;border:2px solid #9aa5bd;border-radius:7px;background:#fff;font-size:18px;line-height:22px;color:#fff;padding:0;text-align:center}
.cb.on{background:var(--blue);border-color:var(--blue)}
.rt{flex:1;min-width:0}
.rt .t{font-size:15px}.rt.done .t{text-decoration:line-through;color:#889}
.chip{display:inline-block;font-size:11px;background:#e8eefb;color:var(--navy);border-radius:10px;padding:1px 8px;margin-right:4px}
.chip.late{background:#fde8d9;color:#9a3d00}.chip.us{background:#fff2cc;color:#6b5200}
.tm{flex:none;font-size:12px;color:var(--mut);width:42px;text-align:right}
.bar{height:12px;background:#e6eaf3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.big{font-size:34px;font-weight:700;color:var(--navy)}
.btn{width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:700;margin-top:8px}
.btn.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
select,input,textarea{width:100%;font-size:16px;padding:9px;border:1px solid #b9c1d1;border-radius:8px;background:#fff;font-family:inherit}
label{display:block;font-size:12px;color:#444;margin:8px 0 3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{flex:none;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:16px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--blue);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
#sheet.on{display:block}
#sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grid button{border:1px solid #b9c1d1;background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;min-width:50px}
.grid button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid button.fut{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:1}
.alert{background:#fff2cc;border:1px solid #e6c76a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.empty{color:#778;text-align:center;padding:14px;font-size:14px}
canvas{width:100%;height:190px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ms{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.ms b{color:var(--org)}
</style>
</head>

function drawDaily(){
  var cv=$("cvp");if(!cv)return;var c=cv.getContext("2d"),W=cv.width,H=cv.height,td=todayS();
  c.clearRect(0,0,W,H);c.font="12px Calibri,sans-serif";
  var days=[],by={};allOccs().forEach(function(o){if(o.t.k==="e"||!tracked(o)||o.d>ENDNOV)return;var b=by[o.d]=by[o.d]||{t:0,d:0};b.t++;if(isDone(o.k))b.d++});
  for(var d=db.set.from;d<=ENDNOV;d=add(d,1))days.push(d);
  if(!days.length)return;var L=34,B=28,T=8,pw=W-L-6,ph=H-T-B,bw=pw/days.length;
  c.fillStyle="#667";c.textAlign="right";[0,50,100].forEach(function(v){var y=T+ph-ph*v/100;c.strokeStyle="#e3e7f0";c.beginPath();c.moveTo(L,y);c.lineTo(W-4,y);c.stroke();c.fillText(v+"%",L-4,y+4)});
  days.forEach(function(d,i){var b=by[d]||{t:0,d:0},x=L+i*bw,p=b.t?b.d/b.t:0,past=d<=td;
    var hd=ph*p,hr=past&&b.t?ph*(1-p):0;
    c.fillStyle="#1f3864";c.fillRect(x+1,T+ph-hd,bw-2,hd);
    if(hr){c.fillStyle="#ED7D31";c.fillRect(x+1,T+ph-hd-hr,bw-2,hr)}
    else if(!past){c.fillStyle="#e3e7f0";c.fillRect(x+1,T+ph-4,bw-2,4)}
    if(i%Math.ceil(days.length/8)===0){c.fillStyle="#667";c.textAlign="center";c.fillText(pd(d).getDate(),x+bw/2,H-10)}});
}

    var o=occs(t)[0],dn=db.done[o.k];
    h+='<div class="kv"><span>Jadwal</span><b>'+(o.s===o.d?fd(o.d):fd(o.s)+" – "+fd(o.d))+'</b></div>'+
     '<div class="kv"><span>Status</span><b>'+(dn?"Selesai "+fd(ymd(new Date(dn.t)))+" "+pad(new Date(dn.t).getHours())+":"+pad(new Date(dn.t).getMinutes()):(o.d<todayS()?"Terlambat":"Belum selesai"))+'</b></div>'+
     '<label>Catatan hasil / checkpoint</label><textarea id="dnn" rows="3" placeholder="mis. jumlah, temuan, kendala">'+esc(dn?dn.n:"")+'</textarea>'+
     '<button class="btn" data-ck="'+o.k+'">'+(dn?"Simpan catatan":"✓ Tandai selesai")+'</button>'+(dn?'<button class="btn alt" data-uck="'+o.k+'">Batalkan selesai</button>':'');
  }else{
    var oc=occs(t).filter(tracked),td=todayS();
    h+='<label>Checkpoint per tanggal ('+oc.filter(function(o){return isDone(o.k)}).length+'/'+oc.length+')</label><div class="grid">'+oc.map(function(o){return'<button data-tg="'+o.k+'" class="'+(isDone(o.k)?"on":"")+(o.d>td?" fut":"")+'" '+(d===o.d?'style="outline:2px solid var(--org)"':'')+'>'+fds(o.d)+(isDone(o.k)?" ✓":"")+'</button>'}).join("")+'</div>';
  }
  if(t.k!=="e"){var off=db.set.off[t.i];
    h+='<label style="margin-top:14px">Jam pengingat</label><input type="time" id="rtm" value="'+timeOf(t)+'" data-i="'+id+'"><label><input type="checkbox" id="roff" data-i="'+id+'" style="width:auto" '+(off?"":"checked")+'> Pengingat aktif untuk pekerjaan ini</label>'}
  h+='<button class="btn alt" id="sclose">Tutup</button>';
  $("sin").innerHTML=h;$("sheet").classList.add("on");
}

/* ================= AKSI ================= */
function toggle(k){
  if(db.done[k]){delete db.done[k];toast("Checkpoint dibatalkan")}
  else{db.done[k]={t:Date.now(),n:""};toast("✓ Checkpoint tersimpan "+pad(new Date().getHours())+":"+pad(new Date().getMinutes()))}
  save();renderAll();
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tg],[data-open],[data-ck],[data-uck],[data-fa],[data-fs],[data-evdel]");
  var id=e.target.id;
  if(e.target.closest("#sheet")&&e.target.id==="sheet"){$("sheet").classList.remove("on");return}
  if(id==="sclose"){$("sheet").classList.remove("on");return}
  if(id==="askn"||id==="askn2"){askPerm();return}
  if(id==="ics"){makeICS();return}
  if(id==="csv"){makeCSV();return}
  if(id==="bkp"){dl("cadangan_rencana_kerja_"+todayS()+".json",JSON.stringify(db),"application/json");return}
  if(id==="rst"){if(confirm("Hapus semua checkpoint dan catatan kejadian?")){db.done={};db.ev=[];db.fired={};save();renderAll();toast("Direset")}return}
  if(id==="share"){shareSummary();return}
  if(id==="evadd"){var i=e.target.dataset.i;db.ev.push({i:i,t:Date.now(),n:$("evn").value.trim()});save();renderAll();openTask(i);toast("Kejadian dicatat");return}
  if(!el)return;
  if(el.dataset.evdel){db.ev=db.ev.filter(function(x){return String(x.t)!==el.dataset.evdel});save();renderAll();var tt=$("sin").querySelector("#evadd");if(tt)openTask(tt.dataset.i);return}
  if(el.dataset.fa!==undefined){fArea=el.dataset.fa;renderRencana();return}
  if(el.dataset.fs!==undefined){fSt=el.dataset.fs;renderRencana();return}
  if(el.dataset.ck){var k=el.dataset.ck,n=$("dnn").value.trim();if(db.done[k])db.done[k].n=n;else{db.done[k]={t:Date.now(),n:n};toast("✓ Checkpoint tersimpan")}save();renderAll();$("sheet").classList.remove("on");return}
  if(el.dataset.uck){delete db.done[el.dataset.uck];save();renderAll();$("sheet").classList.remove("on");return}
  if(el.dataset.tg){var inSheet=!!e.target.closest("#sheet");toggle(el.dataset.tg);if(inSheet){var tid=el.dataset.tg.split("|")[0];openTask(tid)}return}
  if(el.dataset.open){openTask(el.dataset.open,el.dataset.d);return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="snotif"){db.set.notif=t.checked;save()}
  if(t.id==="swd"){db.set.wd=+t.value;save();renderAll()}
  if(t.id==="sfrom"&&t.value){db.set.from=t.value;save();renderAll()}
  if(t.id==="rtm"&&t.value){db.set.tm[t.dataset.i]=t.value;save();toast("Jam pengingat disimpan")}
  if(t.id==="roff"){if(t.checked)delete db.set.off[t.dataset.i];else db.set.off[t.dataset.i]=1;save()}
  if(t.id==="imp"){var f=t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.done)throw 0;if(confirm("Ganti semua data di HP ini dengan cadangan?")){db=Object.assign(db,d);save();renderAll();toast("Data dipulihkan")}}catch(x){toast("File cadangan tidak valid")}};r.readAsText(f)}
});
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});
  document.querySelectorAll(".tab").forEach(function(s){s.classList.toggle("on",s.id==="t-"+b.dataset.t)});renderAll()}});

/* ================= EKSPOR ================= */
function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function makeCSV(){
  var rows=[["Tanggal jadwal","Area","Tahap","Pekerjaan","Status","Waktu checkpoint","Catatan"]];
  allOccs().filter(function(o){return o.t.k!=="e"&&tracked(o)}).sort(function(a,b){return a.d.localeCompare(b.d)}).forEach(function(o){var dn=db.done[o.k];
    rows.push([o.d,AREA[o.t.a],o.t.th,o.t.x,dn?"Selesai":(o.d<todayS()?"Terlewat":"Belum"),dn?new Date(dn.t).toLocaleString("id-ID"):"",dn?dn.n:""])});
  db.ev.forEach(function(e){var t=TBY[e.i];rows.push([ymd(new Date(e.t)),AREA[t.a],t.th,t.x,"Kejadian",new Date(e.t).toLocaleString("id-ID"),e.n])});
  dl("log_checkpoint_"+todayS()+".csv","\ufeff"+rows.map(function(r){return r.map(function(c){return'"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n"),"text/csv");
}
function shareSummary(){
  var s=stats(""),td=todayS(),tx="Progres Rencana Kerja November 2026 ("+fds(td)+")\n· Total: "+pct(s.done,s.tot)+"% ("+s.done+"/"+s.tot+")\n· Sesuai jadwal sampai hari ini: "+s.dueDone+"/"+s.due+" ("+pct(s.dueDone,s.due)+"%)\n· Terlewat: "+s.late+"\n"+
   Object.keys(AREA).map(function(a){var x=stats(a);return"· "+AREA[a]+": "+pct(x.done,x.tot)+"% ("+x.done+"/"+x.tot+")"}).join("\n");
  if(navigator.share)navigator.share({text:tx}).catch(function(){});else if(navigator.clipboard){navigator.clipboard.writeText(tx);toast("Ringkasan disalin")}else prompt("Salin ringkasan:",tx);
}
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function fold(l){var o="";while(l.length>73){o+=l.slice(0,73)+"\r\n ";l=l.slice(73)}return o+l}
function dtl(d,tm){return d.replace(/-/g,"")+"T"+tm.replace(":","")+"00"}
function addMin(tm,m){var a=tm.split(":"),t=(+a[0]*60+ +a[1]+m)%1440;return pad(Math.floor(t/60))+":"+pad(t%60)}
function makeICS(){
  var td=todayS(),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lavaland//Rencana Kerja Kebun//ID","CALSCALE:GREGORIAN","X-WR-CALNAME:Rencana Kerja Kebun","X-WR-TIMEZONE:Asia/Jakarta"];
  var stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",n=0;
  function ev(uid,d,tm,sum,desc,rule,rdates){
    L.push("BEGIN:VEVENT","UID:"+uid+"@lavaland-kebun","DTSTAMP:"+stamp,"DTSTART:"+dtl(d,tm),"DTEND:"+dtl(d,addMin(tm,30)),"SUMMARY:"+icsEsc(sum),"DESCRIPTION:"+icsEsc(desc));
    if(rule)L.push("RRULE:"+rule);if(rdates)L.push("RDATE:"+rdates.map(function(x){return dtl(x,tm)}).join(","));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"TRIGGER:PT0M","END:VALARM","END:VEVENT");n++}
  TASKS.forEach(function(t){
    if(t.k==="e"||db.set.off[t.i])return;var tm=timeOf(t),sum="["+AREA[t.a]+"] "+t.x,desc="Hasil: "+t.h+(t.nt?"\nCatatan: "+t.nt:"");
    var oc=occs(t).filter(function(o){return o.d>=td});if(!oc.length)return;
    if(t.k==="o"){var o=oc[0];var first=o.s<td?td:o.s;ev(t.i,first,tm,sum,desc);if(o.d!==first&&o.d>=td)ev(t.i+"-batas",o.d,tm,"BATAS: "+sum,desc)}
    else if(t.k==="d")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=DAILY;COUNT="+oc.length);
    else if(t.k==="a")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=DAILY;INTERVAL=2;COUNT="+oc.length);
    else if(t.k==="w")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=WEEKLY;COUNT="+oc.length);
    else if(t.k==="ds"){ev(t.i,oc[0].d,tm,sum,desc,null,oc.length>1?oc.slice(1).map(function(o){return o.d}):null)}
  });
  L.push("END:VCALENDAR");
  dl("rencana_kerja_kebun.ics",L.map(fold).join("\r\n"),"text/calendar");toast(n+" acara dalam file kalender");
}

/* ================= NOTIFIKASI ================= */
function reminders(){
  var r=[];TASKS.forEach(function(t){if(t.k==="e"||db.set.off[t.i])return;var tm=timeOf(t);
    occs(t).forEach(function(o){
      r.push({id:o.k+"@"+o.s,k:o.k,t:new Date(o.s+"T"+tm+":00").getTime(),title:"["+AREA[t.a]+"] "+timeOf(t),body:t.x});
      if(t.k==="o"&&o.d!==o.s)r.push({id:o.k+"@"+o.d+"B",k:o.k,t:new Date(o.d+"T"+tm+":00").getTime(),title:"Batas hari ini · "+AREA[t.a],body:t.x})})});
  return r}
function fire(r){
  var nt=db.set.notif&&window.Notification&&Notification.permission==="granted";
  window.__fired=(window.__fired||[]).concat(r.id);
  toast("⏰ "+r.body.slice(0,70));
  if(!nt)return;
  var opt={body:r.body,tag:r.id,icon:"icon-192.png",badge:"icon-192.png",data:{k:r.k}};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(g){g.showNotification(r.title,opt)}).catch(function(){try{new Notification(r.title,opt)}catch(e){}});
  else try{new Notification(r.title,opt)}catch(e){}}
function checkReminders(){
  if(!db.set.notif)return;var now=nowD().getTime(),n=0,from=db.set.from;
  reminders().forEach(function(r){if(r.t>now||now-r.t>18*36e5||db.fired[r.id]||isDone(r.k)||r.id.split("@")[1].slice(0,10)<from)return;
    db.fired[r.id]=1;n++;if(n<=4)fire(r)});
  if(n>4){fire({id:"ringkas"+now,k:"",title:"Pengingat pekerjaan",body:"Ada "+n+" pekerjaan menunggu. Buka aplikasi untuk detail."})}
  if(n){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}}
function askPerm(){
  if(!window.Notification){toast("Browser ini tidak mendukung notifikasi");return}
  Notification.requestPermission().then(function(p){
    if(p==="granted"){fire({id:"uji"+Date.now(),k:"",title:"Rencana Kerja Kebun",body:"Notifikasi aktif. Pengingat pekerjaan akan muncul di sini."});
      if("serviceWorker"in navigator)navigator.serviceWorker.ready.then(function(g){if(g.periodicSync)g.periodicSync.register("kebun-remind",{minInterval:36e5}).catch(function(){})});}
    else toast(p==="denied"?"Izin ditolak. Ubah di pengaturan situs browser.":"Izin belum diberikan");renderAll()})}
function pushState(){ // salinan jadwal pengingat untuk service worker (periodic sync)
  try{if(!window.caches)return;var now=Date.now(),rem=reminders().filter(function(r){return r.t>now-18*36e5&&r.t<now+4*864e5});
    var done={};rem.forEach(function(r){if(isDone(r.k))done[r.k]=1});
    caches.open("kebun-state").then(function(c){return c.put("state.json",new Response(JSON.stringify({rem:rem,done:done,fired:db.fired,off:!db.set.notif})))}).catch(function(){})}catch(e){}}

/* ================= MULAI ================= */
function renderAll(){var on=document.querySelector(".tab.on").id;
  if(on==="t-hari")renderHari();else if(on==="t-rencana")renderRencana();else if(on==="t-progres")renderProgres();else renderAtur();
  var p=stats("");$("hdr").textContent="November 2026 · Progres "+pct(p.done,p.tot)+"% · "+p.late+" terlewat"}
renderAll();checkReminders();pushState();
setInterval(function(){checkReminders();if(document.querySelector(".tab.on").id==="t-hari")renderHari()},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){checkReminders();renderAll()}});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
