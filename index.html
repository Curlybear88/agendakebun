<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rencana Kerja Kebun · Lavaland Farmhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --navy:#1f3864;--navy2:#172a4d;--blue:#4472C4;--blue-l:#e9effa;--org:#ED7D31;--org-l:#fdeee3;
  --bg:#f3f5f9;--card:#fff;--line:#e2e7ef;--line2:#eef1f6;--txt:#1b2333;--mut:#6b7486;--mut2:#98a0b0;
  --ok:#2e7d4f;--ok-l:#e6f3ec;--bad:#b42318;--bad-l:#fdecea;--warn:#8a5a00;--warn-l:#fff4d6;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- kerangka ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 232px,var(--bg) 232px)}
.side{background:var(--navy);color:#cfd8ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:34px;height:34px;border-radius:8px;background:var(--org);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:20px;height:20px;fill:#fff}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:#9fb0cf}
nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
nav .nl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8193b5;padding:8px 12px 6px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 12px;color:#cfd8ea;font-size:14px}
nav button svg{width:18px;height:18px;fill:currentColor;opacity:.85;flex:none}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--org)}
nav button .cnt{margin-left:auto;font-size:11px;background:var(--org);color:#fff;border-radius:9px;padding:0 7px;line-height:18px}
.sfoot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9fb0cf}
.sfoot b{display:block;color:#fff;font-size:13px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 36px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.ph h1{margin:0;font-size:22px;font-weight:650;color:var(--navy);letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 36px 48px;max-width:1440px;width:100%}
.tab{display:none}.tab.on{display:block}

/* ---------- komponen ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:20px;min-width:0}
.phd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.phd h3{margin:0;font-size:15px;font-weight:650;color:var(--txt)}
.phd .muted{font-size:12.5px}
.pbd{padding:16px 18px}
.pbd.np{padding:0}
.muted{color:var(--mut)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.sech h2{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start}
.g2>.panel,.g3>.panel,.g21>.panel,.g12>.panel{margin-bottom:0}
.gap{height:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi.o:before{background:var(--org)}.kpi.n:before{background:var(--navy)}.kpi.g:before{background:#9aa6bd}.kpi.k:before{background:var(--ok)}
.kpi .kl{font-size:12.5px;color:var(--mut);font-weight:500}
.kpi .kv{font-size:28px;font-weight:650;color:var(--navy);line-height:1.15;margin-top:6px;letter-spacing:-.4px}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--mut);margin-left:3px}
.kpi .ks{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:18px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.berjalan{background:var(--blue-l);color:var(--navy)}
.badge.selesai{background:#eef0f4;color:#5a6478}
.badge.rencana{background:var(--org-l);color:#b0510f}
.badge.late{background:var(--bad-l);color:var(--bad)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;background:#f0f3f8;color:#465068;margin-right:4px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:7px;padding:8px 15px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.sec{background:#fff;color:var(--txt);border-color:#cfd6e2}
.btn.sec:hover{background:#f6f8fb;filter:none}
.btn.del{background:#fff;color:var(--bad);border-color:#efc2bd}
.btn.del:hover{background:var(--bad-l);filter:none}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.blk{width:100%}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:0}
.lnk:hover{text-decoration:underline}

.seg{display:inline-flex;background:#e9edf4;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 13px;font-size:13px;color:#4a5468;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);background:#f7f9fc;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tb td.w{white-space:normal}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr[data-ec]{cursor:pointer}
.tb tbody tr:hover td{background:#f8fafd}
.tb .r{text-align:right}.tb .c{text-align:center}
.tb .b{font-weight:600}
.tscroll{overflow-x:auto}

.dl{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13.5px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:500}
.kvl .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kvl .kv:last-child{border-bottom:0}
.kvl .kv span{color:var(--mut)}.kvl .kv b{font-weight:600;text-align:right}

.bar{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.o i{background:var(--org)}.bar.k i{background:var(--ok)}

.empty{color:var(--mut2);text-align:center;padding:28px 16px;font-size:13.5px}
.note{font-size:12.5px;color:var(--mut);padding:10px 18px 14px}

label.fl{display:block;font-size:12.5px;font-weight:600;color:#3a4458;margin:0 0 5px}
input,select,textarea{width:100%;font-size:14px;padding:8px 11px;border:1px solid #cfd6e2;border-radius:7px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(68,114,196,.15)}
textarea{resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fg .full{grid-column:1/-1}

/* ---------- dialog ---------- */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#sheet.on{display:flex}
#sheet .dlg{background:#fff;border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.3)}
#sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
#sheet .mh h3{margin:0;font-size:17px;color:var(--navy)}
#sheet .mh .x{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:2px 6px;border-radius:6px}
#sheet .mh .x:hover{background:#f0f3f8}
#sheet .mb{padding:20px 22px;overflow:auto}
#sheet .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 12px 12px}
#sheet .mf .sp{flex:1}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.mstrip div{background:#f8fafd;padding:10px 14px}
.mstrip span{display:block;font-size:11.5px;color:var(--mut)}
.mstrip b{font-size:15px;color:var(--navy)}

.toast{position:fixed;right:28px;bottom:28px;background:#1b2333;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:60;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:none}

/* ---------- layar kecil ---------- */
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .seg{max-width:100%;overflow-x:auto}
  .side{position:sticky;height:auto;z-index:20}
  .brand{padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  nav .nl{display:none}
  nav button{width:auto;flex:none}
  .sfoot{display:none}
  .ph{padding:18px 16px 14px;flex-direction:column;align-items:flex-start}
  .content{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpi .kv small{font-size:14px}
.atag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#3a4458;white-space:nowrap}
.atag i{width:8px;height:8px;border-radius:2px}
.tag.us{background:var(--warn-l);color:var(--warn)}
.cnt{display:inline-block;font-size:11.5px;border-radius:9px;padding:0 7px;line-height:18px;margin-left:6px;vertical-align:1px;background:#eef0f4;color:#5a6478}
.cnt.bad{background:var(--bad-l);color:var(--bad)}
.pmini{display:flex;align-items:center;gap:10px}.pmini .bar{width:120px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--blue-l);border:1px solid #c9d6f0;border-radius:var(--r);padding:12px 18px;margin-bottom:20px}
.banner b{display:block;color:var(--navy)}.banner span{font-size:13px;color:var(--mut)}
/* baris tugas */
.trow{display:grid;grid-template-columns:30px 84px minmax(0,1fr) 100px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:#f8fafd}
.trow .ck{width:24px;height:24px;border:2px solid #b7c0d0;border-radius:6px;background:#fff;padding:0;display:grid;place-items:center}
.trow .ck svg{width:16px;height:16px;fill:#fff;opacity:0}
.trow .ck:hover{border-color:var(--blue)}
.trow .ck.on{background:var(--ok);border-color:var(--ok)}.trow .ck.on svg{opacity:1}
.trow .tw{font-size:13px;color:var(--txt)}.trow .tw span{display:block;font-size:11.5px;color:var(--mut)}
.trow .tx{font-size:14px;font-weight:500}
.trow.dn .tx{color:var(--mut2);text-decoration:line-through}
.trow .tm2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;font-size:12px}
.trow .ts{text-align:right}
.lst .li{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.lst .li:last-child{border-bottom:0}
.lst .li[data-open]{cursor:pointer}.lst .li[data-open]:hover{background:#f8fafd}
.lst .tx{font-size:13.5px;font-weight:500}
.dt{flex:none;width:42px;text-align:center;border-radius:7px;background:var(--blue-l);color:var(--navy);padding:4px 0;line-height:1.1}
.dt b{display:block;font-size:16px}.dt span{font-size:11px;text-transform:uppercase}
.dt.o{background:var(--org-l);color:#b0510f}
/* tabel rencana */
.tb tr.grp td{background:#f3f6fb;font-weight:650;color:var(--navy);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 14px}
.tb tr[data-open]{cursor:pointer}
.capc{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.capc .bar{width:64px;height:6px}.capc span{font-size:12.5px;min-width:42px;text-align:right}
/* progres */
.arow{margin-bottom:18px}.arow:last-child{margin-bottom:0}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ah .atag{font-size:13.5px}
/* dialog */
.sub2{font-size:12.5px;font-weight:600;color:#3a4458;margin:4px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{border:1px solid #cfd6e2;background:#fff;border-radius:6px;padding:5px 9px;font-size:12.5px;min-width:62px}
.grid button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.grid button.fut{color:var(--mut2);border-style:dashed}
.grid button.cur{box-shadow:0 0 0 2px var(--org)}
.stline{margin-bottom:14px;display:flex;align-items:center;gap:8px}
.evl>div{position:relative;padding:10px 12px;border:1px solid var(--line2);border-radius:7px;margin-bottom:8px;font-size:13px}
.evl p{margin:3px 0 0}.evl .lnk{position:absolute;right:12px;top:10px;font-size:12px}
.sw{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.sw input{width:16px;height:16px;margin:0;accent-color:var(--blue)}
/* laporan */
.dpick{display:flex;align-items:center;gap:10px}.dpick input{width:170px}
.lapg{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:20px;align-items:start}
.prevw{position:sticky;top:20px}
.prevw .panel{margin-bottom:0}
.wa{background:#efeae2;padding:16px;border-radius:0 0 var(--r) var(--r);max-height:calc(100vh - 260px);overflow:auto}
#lprev{background:#fff;border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.5;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tlh{display:flex;align-items:center;gap:10px}
.tlh input{width:150px;padding:5px 9px;font-size:13.5px;font-weight:600}
.lapx{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lapx .no{flex:none;width:22px;font-size:12px;color:var(--mut2);text-align:right}
.lapx input{flex:1}
.lapx .st{flex:none;width:86px;border:1px solid #cfd6e2;background:#fff;border-radius:7px;padding:7px 0;font-size:12.5px;color:var(--mut)}
.lapx .st.on{background:var(--ok-l);border-color:#a8d3b9;color:var(--ok);font-weight:600}
.lapx .x{flex:none;border:0;background:none;font-size:20px;line-height:1;color:var(--mut2);padding:4px 8px;border-radius:6px}
.lapx .x:hover{background:var(--bad-l);color:var(--bad)}
.lapadd{display:flex;gap:8px;margin-left:30px}
.lapadd+.lapadd{margin-top:8px}
.lapadd select{color:var(--blue);border-style:dashed;background:#fafcff}
.prof summary{cursor:pointer;padding:14px 18px;font-weight:650;font-size:15px;list-style:none}
.prof summary::-webkit-details-marker{display:none}
.prof summary:before{content:"▸";display:inline-block;margin-right:8px;color:var(--mut);transition:.15s}
.prof[open] summary:before{transform:rotate(90deg)}
.prof[open] summary{border-bottom:1px solid var(--line2)}
@media (max-width:1200px){.lapg{grid-template-columns:1fr}.prevw{position:static}}
@media (max-width:860px){.trow{grid-template-columns:28px minmax(0,1fr);}.trow .tw,.trow .ts{display:none}.lapadd{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="lg"><svg viewBox="0 0 24 24"><path d="M12 3c-4.4 0-8 3.6-8 8 0 4.8 3.6 9 8 9s8-4.2 8-9c0-4.4-3.6-8-8-8zm-1 2.1v13.8C8.2 18.3 6 15.2 6 11.5c0-3.2 2.2-5.8 5-6.4zm2 0c2.8.6 5 3.2 5 6.4 0 3.7-2.2 6.8-5 7.4z"/></svg></div><div><b>Rencana Kerja Kebun</b><small>Lavaland Farmhouse</small></div></div>
  <nav>
    <div class="nl">Pekerjaan</div>
    <button data-t="hari" class="on"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 8v10h12V10zm2 2h4v4H8z"/></svg>Hari ini<span class="cnt" id="ncl" style="display:none"></span></button>
    <button data-t="rencana"><svg viewBox="0 0 24 24"><path d="M4 5h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 6h2v2H4zm4 0h12v2H8z"/></svg>Rencana kerja</button>
    <button data-t="progres"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6 0V4h3v16zm6 0v-7h3v7z"/></svg>Progres</button>
    <div class="nl" style="margin-top:10px">Pelaporan</div>
    <button data-t="lap"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8 12v2h8v-2zm0 4v2h8v-2z"/></svg>Laporan harian</button>
    <div class="nl" style="margin-top:10px">Sistem</div>
    <button data-t="atur"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>Pengaturan</button>
  </nav>
  <div class="sfoot"><b id="sdate"></b><span id="hdr"></span></div>
</aside>
<div class="main">
  <header class="ph"><div><h1 id="pt"></h1><p id="ps"></p></div><div class="acts" id="pa"></div></header>
  <main class="content">
    <section id="t-hari" class="tab on"></section>
    <section id="t-rencana" class="tab"></section>
    <section id="t-progres" class="tab"></section>
    <section id="t-lap" class="tab"></section>
    <section id="t-atur" class="tab"></section>
  </main>

var P=new URLSearchParams(location.search);
function nowD(){if(P.get("today")){var h=(P.get("now")||"12:00").split(":");return new Date(P.get("today")+"T"+("0"+h[0]).slice(-2)+":"+h[1]+":00")}return new Date()}
function pad(n){return("0"+n).slice(-2)}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){return new Date(s+"T12:00:00")}
function add(s,n){return ymd(new Date(pd(s).getTime()+n*864e5))}
function diff(a,b){return Math.round((pd(a)-pd(b))/864e5)}
var HARI=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fd(s){var d=pd(s);return HARI[d.getDay()]+" "+d.getDate()+" "+BLN[d.getMonth()]}
function fds(s){var d=pd(s);return d.getDate()+" "+BLN[d.getMonth()]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(i){return document.getElementById(i)};
function toast(t){var m=$("toast");m.textContent=t;m.classList.add("show");setTimeout(function(){m.classList.remove("show")},2200)}
function todayS(){return ymd(nowD())}

/* ================= OKURENSI ================= */
function occs(t){
  var r=[],d;
  if(t.k==="o")r.push({k:t.i,d:t.e||t.s,s:t.s,t:t});
  else if(t.k==="ds")t.ds.forEach(function(x){r.push({k:t.i+"|"+x,d:x,s:x,t:t})});
  else if(t.k==="d")for(d=t.s;d<=t.e;d=add(d,1))r.push({k:t.i+"|"+d,d:d,s:d,t:t});
  else if(t.k==="a")for(d=t.s;d<=t.e;d=add(d,2))r.push({k:t.i+"|"+d,d:d,s:d,t:t});
  else if(t.k==="w"){var wd=t.wd!=null?t.wd:db.set.wd;for(d=t.s;d<=t.e;d=add(d,1))if(pd(d).getDay()==wd)r.push({k:t.i+"|"+d,d:d,s:d,t:t})}

function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function fold(l){var o="";while(l.length>73){o+=l.slice(0,73)+"\r\n ";l=l.slice(73)}return o+l}
function dtl(d,tm){return d.replace(/-/g,"")+"T"+tm.replace(":","")+"00"}
function addMin(tm,m){var a=tm.split(":"),t=(+a[0]*60+ +a[1]+m)%1440;return pad(Math.floor(t/60))+":"+pad(t%60)}
function makeICS(){
  var td=todayS(),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lavaland//Rencana Kerja Kebun//ID","CALSCALE:GREGORIAN","X-WR-CALNAME:Rencana Kerja Kebun","X-WR-TIMEZONE:Asia/Jakarta"];
  var stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",n=0;
  function ev(uid,d,tm,sum,desc,rule,rdates){
    L.push("BEGIN:VEVENT","UID:"+uid+"@lavaland-kebun","DTSTAMP:"+stamp,"DTSTART:"+dtl(d,tm),"DTEND:"+dtl(d,addMin(tm,30)),"SUMMARY:"+icsEsc(sum),"DESCRIPTION:"+icsEsc(desc));
    if(rule)L.push("RRULE:"+rule);if(rdates)L.push("RDATE:"+rdates.map(function(x){return dtl(x,tm)}).join(","));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"TRIGGER:PT0M","END:VALARM","END:VEVENT");n++}
  TASKS.forEach(function(t){
    if(t.k==="e"||db.set.off[t.i])return;var tm=timeOf(t),sum="["+AREA[t.a]+"] "+t.x,desc="Hasil: "+t.h+(t.nt?"\nCatatan: "+t.nt:"");
    var oc=occs(t).filter(function(o){return o.d>=td});if(!oc.length)return;
    if(t.k==="o"){var o=oc[0];var first=o.s<td?td:o.s;ev(t.i,first,tm,sum,desc);if(o.d!==first&&o.d>=td)ev(t.i+"-batas",o.d,tm,"BATAS: "+sum,desc)}
    else if(t.k==="d")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=DAILY;COUNT="+oc.length);
    else if(t.k==="a")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=DAILY;INTERVAL=2;COUNT="+oc.length);
    else if(t.k==="w")ev(t.i,oc[0].d,tm,sum,desc,"FREQ=WEEKLY;COUNT="+oc.length);
    else if(t.k==="ds"){ev(t.i,oc[0].d,tm,sum,desc,null,oc.length>1?oc.slice(1).map(function(o){return o.d}):null)}
  });
  L.push("END:VCALENDAR");
  dl("rencana_kerja_kebun.ics",L.map(fold).join("\r\n"),"text/calendar");toast(n+" acara dalam file kalender");
}

function reminders(){
  var r=[];TASKS.forEach(function(t){if(t.k==="e"||db.set.off[t.i])return;var tm=timeOf(t);
    occs(t).forEach(function(o){
      r.push({id:o.k+"@"+o.s,k:o.k,t:new Date(o.s+"T"+tm+":00").getTime(),title:"["+AREA[t.a]+"] "+timeOf(t),body:t.x});
      if(t.k==="o"&&o.d!==o.s)r.push({id:o.k+"@"+o.d+"B",k:o.k,t:new Date(o.d+"T"+tm+":00").getTime(),title:"Batas hari ini · "+AREA[t.a],body:t.x})})});
  return r}
function fire(r){
  var nt=db.set.notif&&window.Notification&&Notification.permission==="granted";
  window.__fired=(window.__fired||[]).concat(r.id);
  toast("⏰ "+r.body.slice(0,70));
  if(!nt)return;
  try{new Notification(r.title,{body:r.body,tag:r.id})}catch(e){}}
function checkReminders(){
  if(!db.set.notif)return;var now=nowD().getTime(),n=0,from=db.set.from;
  reminders().forEach(function(r){if(r.t>now||now-r.t>18*36e5||db.fired[r.id]||isDone(r.k)||r.id.split("@")[1].slice(0,10)<from)return;
    db.fired[r.id]=1;n++;if(n<=4)fire(r)});
  if(n>4){fire({id:"ringkas"+now,k:"",title:"Pengingat pekerjaan",body:"Ada "+n+" pekerjaan menunggu. Buka laman ini untuk detail."})}
  if(n){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}}
function askPerm(){
  if(!window.Notification){toast("Browser ini tidak mendukung notifikasi");return}
  Notification.requestPermission().then(function(p){
    if(p==="granted"){fire({id:"uji"+Date.now(),k:"",title:"Rencana Kerja Kebun",body:"Notifikasi aktif. Pengingat pekerjaan akan muncul di sini."});}
    else toast(p==="denied"?"Izin ditolak. Ubah di pengaturan situs browser.":"Izin belum diberikan");renderAll()})}

  return{sections:S}}
function getDoc(tk,date){var k=dkey(tk,date);if(!db.lap.docs[k])db.lap.docs[k]=newDoc(tk,date);return db.lap.docs[k]}
function stOf(it){return it.st||(it.k&&isDone(it.k)?"done":"ongoing")}
function batches(date){return lines(prof().batches).map(function(l){var a=l.split("|").map(function(x){return x.trim()});return{n:a[0]||"",v:a[1]||"",an:a[2]||"",ec:a[3]||"",ts:a[4]||"",pop:a[5]||""}}).filter(function(b){return b.n})}
function popBlock(date){var r=["*UPDATE POPULASI BIBIT*"],b=batches(date);if(!b.length)return[];
  b.forEach(function(x,i){if(i)r.push("");r.push("# *"+x.n+"*","Varietas : "+x.v,"Air Nutrisi : "+x.an+(x.ec?" _(EC "+x.ec+" mS/cm)_":""),"Tgl. Semai : "+(x.ts?fdn(x.ts):"-"),"Umur = "+(x.ts?diff(date,x.ts):"-")+" HSS","Populasi = "+x.pop+" bibit")});return r}
function genText(tk,date){
  var p=prof(),d=getDoc(tk,date),o=[],t2=tk.slice(0,2),ar=tkArea(tk),CA="^^^^^^^^^^^^^^^^^^^^^^^^^^^^",CB="^^^^^^^^^^^^^^^^^^^^^^",CC="------------------------";
  function sec(id){return d.sections.filter(function(s){return s.id===id})[0]}
  function its(s){return(s?s.items:[]).filter(function(i){return i.x&&i.x.trim()})}
  function nums(s,st){return its(s).map(function(it,i){return(i+1)+". "+it.x.trim()+(st?(stOf(it)==="done"?"✅":" _(Ongoing)_"):"")})}
  if(t2==="LP"){
    var ops=String(p[ar==="N"?"ops":"ops"+ar]||"").trim();
    o.push("*["+AREAU[ar]+"] - DAILY PLANNING*","Hari/Tanggal : "+fdl(date),"Leader: "+p.leader);if(ops)o.push("Operator : "+ops);o.push(CA);
    if(ar==="N"){var pb=popBlock(date);if(pb.length)o=o.concat(pb,[CA])}
    o.push("*PRIORITAS & TARGET PEKERJAAN:*");o=o.concat(nums(sec("prior")),[CA]);
    var tls=d.sections.filter(function(s){return/^tl/.test(s.id)&&its(s).length});
    if(tls.length){o.push("*TIMELINE PEKERJAAN*");tls.forEach(function(s,n){
      if(n)o.push(n===1?"========================":"------------------------------");
      o.push(s.t);its(s).forEach(function(i){o.push("• "+i.x.trim())})})}
    var c=sec("cat");if(c&&c.text&&c.text.trim())o.push(CA,"*CATATAN*",c.text.trim());
    o.push(CA);lines(p.foot).forEach(function(l){o.push("• "+l)});
  }else if(t2==="LR"){
    o.push("*["+AREAU[ar]+"] - DAILY REPORT*","Hari/Tanggal: "+fdl(date),"");
    if(ar==="N"){var pb2=popBlock(date);if(pb2.length)o=o.concat(pb2,[CB])}
    o.push("*"+sec("keg").t+"*");its(sec("keg")).forEach(function(i){o.push("• "+i.x.trim()+(stOf(i)==="done"?"✅":" _(Ongoing)_"))});
    var a=sec("akt");if(a&&a.text&&a.text.trim())o.push(CB,a.text.trim());
    o.push(CC,"*RENCANA KEGIATAN ESOK HARI:*");o=o.concat(nums(sec("esok")),[CC,"*MATURNUWUN*🙏"]);
  }else{
    var rep=t2==="SR",lab=ar==="G"?p.label:SUPL[ar];
    o.push("*"+HFULL[pd(date).getDay()]+", "+fdn(date)+"*",(rep?"Realisasi":"Schedule")+" pekerjaan "+lab);
    d.sections.forEach(function(s){if(!its(s).length)return;o.push("*"+s.t+" - _Pelaksanaan & Pengawasan_*");o=o.concat(nums(s,rep));o.push("")});
    while(o.length&&o[o.length-1]==="")o.pop();
  }
  return o.join("\n")}

/* --- opsi dropdown: dari tab Hari ini (terjadwal pada tanggal itu) dan tab Rencana (semua pekerjaan area) --- */
var GSEC={harvest:"P",data:"D",pompa:"R"};
function shortT(x){var t=x.split(" (")[0].split(":")[0].trim();
  if(t.length>48){var c=t.indexOf(", ");if(c>10)t=t.slice(0,c);else{c=t.indexOf(" — ");if(c>10)t=t.slice(0,c)}}
  if(t.length>52){t=t.slice(0,52);t=t.slice(0,t.lastIndexOf(" "))}return t}
function lapOpts(tk,date,s){
  var ar=GSEC[s.id]||tkArea(tk);if(!RUT[ar])return[];
  var dt=s.id==="esok"?add(date,1):date,out=[],have={};
  s.items.forEach(function(i){have[(i.x||"").toLowerCase()]=1;if(i.k)have[i.k]=1});
  var pic=(/^tl/.test(s.id)||s.id==="keg")?": "+prof().leader:"";
  var gH="Terjadwal "+fds(dt)+" (tab Hari ini)",gR="Daftar rutin",gL="Rencana kerja lainnya (tab Rencana)";
  function add1(g,l,x,k){var key=k||x.toLowerCase();if(have[key]||have[x.toLowerCase()])return;have[key]=1;have[x.toLowerCase()]=1;out.push({g:g,l:l,x:x,k:k})}
  var oc=allOccs().filter(function(o){return o.t.a===ar&&o.t.k!=="e"});
  oc.filter(function(o){return o.t.k==="o"?(o.s<=dt&&o.d>=dt):o.d===dt}).sort(function(a,b){return timeOf(a.t).localeCompare(timeOf(b.t))})
    .forEach(function(o){add1(gH,shortT(o.t.x)+(o.t.k==="o"?"":" · "+timeOf(o.t)),shortT(o.t.x)+pic,o.k)});
  lines(prof()[RUT[ar]]).forEach(function(l){add1(gR,l,l+pic)});
  oc.filter(function(o){return o.t.k==="o"}).sort(function(a,b){return a.s.localeCompare(b.s)}).forEach(function(o){add1(gL,shortT(o.t.x)+" · "+fds(o.s),shortT(o.t.x)+pic,o.k)});
  return out}
function lapPreview(){var e=$("lprev");if(e)e.textContent=genText(lapTK(),lapDate())}
function lapSec(id){return getDoc(lapTK(),lapDate()).sections.filter(function(s){return s.id===id})[0]}
function lapCopy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Teks disalin. Tempel di WhatsApp.")},function(){lapCopyOld(t)});else lapCopyOld(t)}
function lapCopyOld(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Teks disalin. Tempel di WhatsApp.":"Gagal menyalin; tekan lama teks hasil lalu salin")}
document.addEventListener("input",function(e){var t=e.target;
  if(t.dataset.lx){var a=t.dataset.lx.split(":");lapSec(a[0]).items[+a[1]].x=t.value;save();lapPreview()}
  else if(t.dataset.lt){lapSec(t.dataset.lt).text=t.value;save();lapPreview()}
  else if(t.dataset.ltt){lapSec(t.dataset.ltt).t=t.value;save();lapPreview()}
  else if(t.dataset.prof){db.lap.prof[t.dataset.prof]=t.value;save();lapPreview()}});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="ldate"&&t.value){lap.dates[lap.kind]=t.value;renderLap();return}
  if(t.dataset.lsel!==undefined){var id=t.dataset.lsel,v=t.value;if(v==="")return;
    if(v==="__manual"){lap.man[id]=true;renderLap();var n=document.querySelector('[data-ladd-in="'+id+'"]');if(n)n.focus();return}
    var sc=lapSec(id),o=lapOpts(lapTK(),lapDate(),sc)[+v];if(o){sc.items.push({x:o.x,k:o.k});save();renderLap();toast("Ditambahkan: "+o.x.slice(0,40))}}});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-lk],[data-lr],[data-la],[data-lst],[data-ldel],[data-ladd],[data-lblock],[data-lcopy],[data-lwa],[data-lreset]");if(!el)return;
  var T=lapTK(),D=lapDate(),ds=el.dataset,a;
  if(ds.lk){lap.kind=ds.lk;renderLap();return}
  if(ds.lr){lap.role=ds.lr;renderLap();return}
  if(ds.la){lap.areas[lap.role]=ds.la;renderLap();return}
  if(ds.lst){a=ds.lst.split(":");var it=lapSec(a[0]).items[+a[1]];it.st=stOf(it)==="done"?"ongoing":"done";save();renderLap();return}
  if(ds.ldel){a=ds.ldel.split(":");lapSec(a[0]).items.splice(+a[1],1);save();renderLap();return}
  if(ds.ladd){var inp=document.querySelector('[data-ladd-in="'+ds.ladd+'"]'),v=inp.value.trim();if(!v){toast("Ketik nama pekerjaan dulu");return}lapSec(ds.ladd).items.push({x:v});lap.man[ds.ladd]=true;save();renderLap();
    var n=document.querySelector('[data-ladd-in="'+ds.ladd+'"]');if(n)n.focus();return}
  if(ds.lblock){var d=getDoc(T,D),n2=d.sections.filter(function(s){return/^tl/.test(s.id)}).length;d.sections.splice(d.sections.length-1,0,mkS("tl"+(n2+Date.now()%1000),"00.00-00.00",[]));save();renderLap();return}
  if(ds.lcopy){lapCopy(genText(T,D));return}
  if(ds.lwa){window.open("https://wa.me/?text="+encodeURIComponent(genText(T,D)),"_blank");return}
  if(ds.lreset){if(confirm("Buat ulang dari "+(lap.kind==="rep"?"rencana":"daftar rutin")+"? Isian yang sudah diedit akan diganti.")){delete db.lap.docs[dkey(T,D)];save();renderLap()}return}
});

/* ================= NAVIGASI & MULAI ================= */
function go(t){document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});document.querySelectorAll(".tab").forEach(function(s){s.classList.toggle("on",s.id==="t-"+t)});window.scrollTo(0,0);renderAll()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
document.addEventListener("click",function(e){var el=e.target.closest("[data-close],[data-go]");if(!el)return;if(el.dataset.go){go(el.dataset.go);return}$("sheet").classList.remove("on")});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("sheet").classList.remove("on")});
function renderAll(){var on=document.querySelector(".tab.on").id;
  if(on==="t-hari")renderHari();else if(on==="t-rencana")renderRencana();else if(on==="t-progres")renderProgres();else if(on==="t-lap")renderLap();else renderAtur();
  var p=stats(""),td=todayS();$("sdate").textContent=HFULL[pd(td).getDay()]+", "+fdn(td);$("hdr").textContent="Progres November "+pct(p.done,p.tot)+"% · "+p.late+" terlewat";
  var all=allOccs().filter(tracked),n=all.filter(function(o){return(o.t.k==="o"?(o.s<=td&&o.d>=td):o.d===td)&&!isDone(o.k)}).length,c=$("ncl");c.textContent=n;c.style.display=n?"":"none"}
renderAll();checkReminders();
setInterval(function(){checkReminders();if(document.querySelector(".tab.on").id==="t-hari")renderHari()},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){checkReminders();renderAll()}});
